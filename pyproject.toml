[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "gnrprobe"
version = "0.1.0"
description = "Request and site-register profiler for GenroPy"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Softwell Srl", email = "info@genropy.org"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
]

# No runtime dependencies on purpose. The archive and the HTTP recorder are
# stdlib only; the register recorder imports genropy, which is always present
# because this is installed INTO a genropy environment. Declaring genropy here
# would re-resolve the very installation being profiled.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gnrprobe = "gnrprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
